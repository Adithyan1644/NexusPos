spring.application.name=nexuspos-backend
server.port=8080

# Database Configuration (H2 File Persistent Store)
spring.datasource.url=jdbc:h2:file:./data/nexusposdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
nexuspos.jwt.secret=9a3f8c7d6e5b4a3f8c7d6e5b4a3f8c7d6e5b4a3f8c7d6e5b4a3f8c7d6e5b4a3f
nexuspos.jwt.expirationMs=86400000
